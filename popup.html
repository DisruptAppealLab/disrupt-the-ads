<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Disrupt The Ads</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b1220;
        --panel: #111b2d;
        --panel-2: #18253d;
        --text: #edf5ff;
        --muted: #aac0df;
        --accent: #58d2b8;
        --accent-2: #3db7ff;
        --danger: #ff6b6b;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        width: 320px;
        min-height: 260px;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .panel {
        padding: 16px 18px;
        background: var(--panel);
        border: 1px solid #23314d;
      }

      h1 {
        margin: 0 0 14px;
        font-size: 20px;
        letter-spacing: 0.02em;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 12px 0;
      }

      .label {
        font-size: 14px;
        color: var(--text);
      }

      .sub {
        margin-top: 6px;
        font-size: 12px;
        color: var(--muted);
      }

      button[role="switch"] {
        position: relative;
        width: 42px;
        height: 22px;
        border: 0;
        border-radius: 999px;
        background: #3b4d6e;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      button[role="switch"]::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 4px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: white;
        transition: transform 0.2s ease;
      }

      button[role="switch"][aria-checked="true"] {
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
      }

      button[role="switch"][aria-checked="true"]::after {
        transform: translateX(18px);
      }

      .stats {
        margin-top: 18px;
        padding: 12px 10px;
        border-radius: 10px;
        background: var(--panel-2);
        text-align: center;
      }

      #count {
        display: block;
        font-size: 24px;
        font-weight: 700;
        color: var(--accent);
      }

      #countLabel {
        display: block;
        margin-top: 4px;
        font-size: 12px;
        color: var(--muted);
      }

      #reload {
        width: 100%;
        margin-top: 16px;
        padding: 10px 12px;
        border: 0;
        border-radius: 8px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        color: #031019;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Disrupt The Ads</h1>

      <div class="row">
        <span class="label">Block all sites</span>
        <button id="globalSwitch" role="switch" aria-checked="true" aria-label="Toggle global blocking"></button>
      </div>
      <div id="globalSub" class="sub">On for all sites</div>

      <div id="siteRow" class="row">
        <span class="label">Pause on this site</span>
        <button id="siteSwitch" role="switch" aria-checked="false" aria-label="Toggle site blocking"></button>
      </div>
      <div id="siteSub" class="sub">Blocking is active</div>

      <div class="stats">
        <span id="count">0</span>
        <span id="countLabel">requests blocked on this page</span>
      </div>

      <button id="reload">Reload tab</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
